<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هوامش Photopea</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="panel">

    <h2>هوامش المستند</h2>

    <p class="description">
      إضافة Guides حقيقية إلى المستند
    </p>

    <label for="margin">الهامش</label>

    <div class="input-group">
      <input
        id="margin"
        type="number"
        value="1.5"
        min="0.1"
        step="0.1"
      />

      <span>سم</span>
    </div>

    <button id="addGuides">
      إضافة Guides
    </button>

    <div id="status"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
